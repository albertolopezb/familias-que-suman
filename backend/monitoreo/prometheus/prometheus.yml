# Prometheus: cada 15 s le pregunta sus métricas a cada servicio y las guarda 15 días.
# Todo por la red interna `monitoreo`: nada de esto se ve desde internet.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  # Solo existe con el perfil `tunel`; si no está, aparece como "down" y no pasa nada.
  - job_name: tunel
    static_configs:
      - targets: ["tunel:2000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
