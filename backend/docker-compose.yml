# Servidor de Familias que Suman. Gradle ignora esta carpeta.
# Levantar desde backend/:   docker compose --env-file .env up -d

services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Solo accesible desde la propia máquina. Nunca se expone a internet.
    ports:
      - "127.0.0.1:5432:5432"

  almacenamiento:
    # Fotos de testimonios (RF-12), protocolo S3.
    # La imagen oficial minio/minio se archivó en abril de 2026 y ya no recibe
    # parches. Esta es un fork comunitario compatible: VERIFICAR que siga
    # mantenido. Cambiar de imagen no toca el código de la API: el protocolo es el mismo.
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # consola web, solo para el equipo

  # api:           PENDIENTE — ¿API propia o BFF sobre el backend existente?
  # cloudflared:   se agrega cuando exista una API que exponer.

volumes:
  db-data:
  storage-data:
